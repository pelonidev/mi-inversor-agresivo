# Funding Radar — despliegue 24/7 en VPS.
# Arranque:  docker compose up -d --build
# Logs:      docker compose logs -f

services:
  funding-radar:
    build: .
    container_name: agresivo-radar
    # Carga API keys, tokens de Telegram y AUTO_TRADE desde el .env del host.
    env_file:
      - .env
    # Resiliencia: se reinicia solo tras crash, OOM o reboot del servidor.
    restart: unless-stopped
    # Persistencia del estado de paper trading (portfolio_state.json) entre
    # actualizaciones de la imagen. Volumen gestionado por Docker.
    volumes:
      - radar-data:/app/data
    # Rotación de logs: evita que el daemon 24/7 llene el disco del VPS.
    logging:
      driver: json-file
      options:
        max-size: "10m"   # cada archivo de log, máx 10 MB
        max-file: "5"     # conserva 5 -> 50 MB de logs como máximo
    # Sobrescribe el exchange sin reconstruir la imagen si hace falta.
    # command: ["python", "daemon.py", "--exchange", "binance"]
    stop_grace_period: 20s

volumes:
  radar-data:   # estado del paper trading persistente
